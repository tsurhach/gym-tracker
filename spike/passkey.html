<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Passkey test</title>
<!-- TEMP-PASSKEY-SPIKE: throwaway test page. Delete this folder after the test. No server, nothing is verified or sent. -->
<style>
  body { font: 20px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  h1 { font-size: 26px; margin: 0 0 8px; }
  button { display: block; width: 100%; font: inherit; font-weight: 600; padding: 16px; margin: 12px 0; border-radius: 12px; border: 2px solid #888; background: transparent; color: inherit; }
  button.go { background: #2563eb; border-color: #2563eb; color: #fff; }
  button:disabled { opacity: .4; }
  #out { white-space: pre-wrap; font-size: 22px; line-height: 1.5; margin: 16px 0; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>Passkey test</h1>
<p>Do step 1, then step 2. Then tap Copy results and paste them back.</p>
<button class="go" id="b1">1. Create test passkey</button>
<button class="go" id="b2" disabled>2. Use the passkey (twice)</button>
<button id="b3">Copy results</button>
<div id="out"></div>
<p><a href="../">Back to the app</a></p>
<script>
const out = document.getElementById("out");
const b1 = document.getElementById("b1"), b2 = document.getElementById("b2");
const lines = {};
const order = [];
function say(key, text) {
  if (!(key in lines)) order.push(key);
  lines[key] = text;
  out.textContent = order.map((k) => lines[k]).join("\n");
}
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
const ua = navigator.userAgent;
const ios = (ua.match(/OS (\d+)_(\d+)/) || [])[0];
const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
say("env", `Opened in: ${standalone ? "HOME SCREEN APP" : "Safari / browser"}\niOS (as the page sees it): ${ios ? ios.replace("OS ", "").replace("_", ".") : "not an iPhone"}\n(Safari may show a frozen number here; check Settings > General > About.)`);

const salt = rnd(32); // same salt for create and both gets; lives only on this page
let credId = null;
const prfOut = (ext) => {
  const r = ext && ext.prf && ext.prf.results && ext.prf.results.first;
  return r ? new Uint8Array(r) : null;
};
const eq = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
const word = (ok) => (ok ? "YES" : "NO");

if (!window.PublicKeyCredential || !navigator.credentials) {
  say("fatal", "NOT SUPPORTED: this browser has no passkey support (WebAuthn). Nothing to test here.");
  b1.disabled = true;
}

b1.onclick = async () => {
  b1.disabled = true;
  say("c", "Step 1: working... answer the Face ID / Passwords prompt.");
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: rnd(32),
        rp: { name: "Gym Tracker test" },
        user: { id: rnd(16), name: "Gym Tracker test", displayName: "Gym Tracker test" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { residentKey: "required", userVerification: "required" },
        extensions: { prf: { eval: { first: salt } } },
      },
    });
    credId = new Uint8Array(cred.rawId);
    const ext = cred.getClientExtensionResults();
    const o = prfOut(ext);
    const enabled = !!(ext.prf && ext.prf.enabled);
    say("c", `Step 1: passkey created: YES\nPRF supported (enabled flag): ${word(enabled)}\nKey returned when creating: ${word(o && o.length === 32)}${o ? ` (${o.length} bytes)` : ""}`);
    b2.disabled = false;
  } catch (e) {
    say("c", `Step 1: passkey created: NO\nReason: ${e.name}: ${e.message}`);
    b1.disabled = false;
  }
};

async function getOnce() {
  const a = await navigator.credentials.get({
    publicKey: {
      challenge: rnd(32),
      allowCredentials: [{ type: "public-key", id: credId }],
      userVerification: "required",
      extensions: { prf: { eval: { first: salt } } },
    },
  });
  return prfOut(a.getClientExtensionResults());
}

b2.onclick = async () => {
  b2.disabled = true;
  say("g", "Step 2: working... you will be asked twice.");
  try {
    const x = await getOnce();
    const y = await getOnce();
    say("g", `Step 2: signed in with passkey: YES\nKey returned on sign-in: ${word(x && x.length === 32)}${x ? ` (${x.length} bytes)` : ""}\nSecond sign-in gave the same key: ${word(eq(x, y))}\n\nOVERALL: ${x && x.length === 32 && eq(x, y) ? "PRF WORKS here" : "PRF does NOT work here"}`);
  } catch (e) {
    say("g", `Step 2: signed in with passkey: NO\nReason: ${e.name}: ${e.message}`);
    b2.disabled = false;
  }
};

document.getElementById("b3").onclick = async () => {
  const text = out.textContent;
  try {
    await navigator.clipboard.writeText(text);
    say("copy", "\nCopied. Paste it back to Claude.");
  } catch {
    const r = document.createRange();
    r.selectNodeContents(out);
    getSelection().removeAllRanges();
    getSelection().addRange(r);
    say("copy", "\nCould not copy automatically. The text is selected: tap Copy in the menu.");
  }
};
</script>
</body>
</html>
